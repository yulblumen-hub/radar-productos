<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar de Productos</title>
<meta name="theme-color" content="#0e1116">
<meta name="description" content="Relevar, puntuar y comentar productos antes de comprar stock.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<script>
  /* antes del CSS: evita el parpadeo al cargar con tema guardado */
  try{ var t = localStorage.getItem("radar-tema"); if(t) document.documentElement.setAttribute("data-theme", t); }catch(e){}
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="layout">

  <aside class="side" id="side">
    <div class="side-marca">
      <span class="logo">◎</span>
      <div>
        <h1>Radar</h1>
        <p class="sub">de Productos</p>
      </div>
      <button class="iconbtn solo-movil" id="cerrarSide" aria-label="Cerrar menú">✕</button>
    </div>

    <nav class="side-nav">
      <div class="side-tit">Explorar</div>
      <button class="snav active" data-view="dashboard"><i>◱</i>Inicio</button>
      <button class="snav" data-view="productos"><i>◧</i>Productos</button>
      <button class="snav" data-view="rubros"><i>◈</i>Rubros</button>
      <button class="snav" data-view="proveedores"><i>◑</i>Proveedores</button>
      <button class="snav" data-view="cotizaciones"><i>◍</i>Cotizaciones<span class="nuevo">Nuevo</span></button>
      <button class="snav" data-view="tiendas"><i>◎</i>Tiendas</button>
      <button class="snav" data-view="nichos"><i>◉</i>Mapa de nichos</button>
      <button class="snav" data-view="misnichos"><i>◈</i>Mis nichos<span class="nuevo">Nuevo</span></button>
      <button class="snav" data-view="favoritos"><i>★</i>Favoritos<span class="cuenta" id="cuentaFav"></span></button>

      <div class="side-tit">Cuenta</div>
      <button class="snav" id="btnYo"><i>☺</i><span id="yoNombre">¿Quién sos?</span></button>
      <button class="snav" id="btnExport"><i>↧</i>Exportar</button>
      <button class="snav" id="btnImport"><i>↥</i>Importar</button>
      <button class="snav" id="btnInstalar" hidden><i>⤓</i>Instalar</button>
    </nav>

    <div class="side-pie">
      <span class="temas" role="group" aria-label="Tema">
        <button data-tema="light" title="Claro">☀</button>
        <button data-tema="soft"  title="Oscuro suave">◐</button>
        <button data-tema="dark"  title="Oscuro">☾</button>
      </span>
      <span class="ver" id="verPie"></span>
    </div>
  </aside>

  <div class="cuerpo">
    <header class="barra">
      <button class="iconbtn solo-movil" id="abrirSide" aria-label="Abrir menú">☰</button>
      <div class="buscador">
        <span class="lupa">⌕</span>
        <input id="qGlobal" placeholder="Buscar producto, rubro, proveedor o tienda…" autocomplete="off">
        <button class="iconbtn" id="limpiarQ" hidden aria-label="Limpiar">✕</button>
      </div>
      <span class="conmuta" id="conmutaOrigen" role="group" aria-label="Origen"></span>
      <button class="btn ghost" id="btnRandom">🎲 Tirame uno</button>
      <button class="btn primary" id="btnNuevo">+ Producto</button>
    </header>

    <div id="resGlobal" class="resglobal" hidden></div>

    <main id="app"></main>
  </div>
</div>

<!-- Modal producto -->
<div class="modal-back" id="modalBack" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modalTitle">Nuevo producto</h2>
      <button class="iconbtn" id="modalClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn danger ghost" id="btnDelete" hidden>Eliminar</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="btnCancel">Cancelar</button>
      <button class="btn primary" id="btnSave">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="fileInput" accept="application/json" hidden>

<div class="modal-back" id="iosBack" hidden>
  <div class="modal" style="max-width:420px">
    <div class="modal-head"><h2>Instalar en el iPhone</h2>
      <button class="iconbtn" id="iosClose" aria-label="Cerrar">✕</button></div>
    <div class="modal-body">
      <p style="font-size:14px;color:var(--tx2);margin:0 0 12px">Safari no tiene botón de instalar, se hace a mano:</p>
      <ol style="font-size:14px;color:var(--tx2);padding-left:20px;margin:0;line-height:1.9">
        <li>Tocá <b style="color:var(--tx)">Compartir</b> (el cuadradito con la flecha)</li>
        <li>Bajá hasta <b style="color:var(--tx)">Agregar a inicio</b></li>
        <li>Confirmá con <b style="color:var(--tx)">Agregar</b></li>
      </ol>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
